# Builds a signed, notarized Apple silicon app for a `v*` tag and publishes it as a draft GitHub
# release. Setting the TAURI_UPDATER_PUBKEY variable adds the updater feed (latest.json);
# without it the release ships without updates, like the app does. Secrets and that variable
# are set in the repository settings, never committed.
name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  # A signed, notarized release needs the signing secrets; until they are configured, releases
  # are built locally and this workflow does nothing.
  guard:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
        run: echo "run=$([ -n "$CERT" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  release:
    needs: guard
    if: needs.guard.outputs.run == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile

      - name: Import the signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/build.keychain"
          password="$(uuidgen)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # The updater's public key and feed URL exist only in release builds, and only once the
      # TAURI_UPDATER_PUBKEY variable is set; an empty override leaves the updater out.
      - name: Updater configuration
        env:
          PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          if [ -n "$PUBKEY" ]; then
            jq -n --arg pubkey "$PUBKEY" --arg feed "https://github.com/${{ github.repository }}/releases/latest/download/latest.json" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey, endpoints: [$feed]}}}' > "$RUNNER_TEMP/release.conf.json"
          else
            echo '{}' > "$RUNNER_TEMP/release.conf.json"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          GITMENU_SENTRY_DSN: ${{ secrets.GITMENU_SENTRY_DSN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: gitmenu ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: ${{ vars.TAURI_UPDATER_PUBKEY != '' }}
          args: --target aarch64-apple-darwin --config ${{ runner.temp }}/release.conf.json
